name: vpnbot

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpnbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vpnbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the compose network reaches PostgreSQL.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Optional password (defence in depth — Redis is NOT published;
    # only this compose network reaches it). To enable: set
    # REDIS_PASSWORD in .env AND set COMPOSE_REDIS_URL there to
    # redis://:<the same password>@redis:6379/0 so the bot/worker
    # services authenticate. (A dedicated variable, NOT REDIS_URL:
    # an existing .env may carry the direct-install localhost URL,
    # and Compose must never start honouring that inside the
    # containers.) Unset (the default) keeps the historical
    # passwordless behaviour — existing installs update safely
    # with no .env change.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --save \"\" --appendonly no --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server --save \"\" --appendonly no; fi"]
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    # FSM state only; losing it on restart costs an in-progress wizard, nothing else.

  migrate:
    build: .
    image: vpnbot:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vpnbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vpnbot}
    command: ["vpnbot", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    image: vpnbot:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vpnbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vpnbot}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8081
    command: ["vpnbot", "run"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      # Probe endpoint only, loopback-bound. Nothing else is exposed.
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build: .
    image: vpnbot:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vpnbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vpnbot}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
    command: ["vpnbot", "worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # The worker has no HTTP surface; process liveness is enough here.
      disable: true

volumes:
  pgdata:
