[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpnbot"
version = "1.0.0"
description = "Persian-first Telegram VPN sales platform with manual (card / crypto) payment verification and single-use inventory."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "aiogram>=3.13,<4.0",
    "SQLAlchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "cryptography>=42,<46",
    "redis>=5.0,<7.0",
    "orjson>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "types-redis",
]

[project.scripts]
vpnbot = "vpnbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends in defaults
    "S101",   # asserts in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"src/vpnbot/cli.py" = ["S105"]
# str+Enum is deliberate: values are compared with plain strings coming from
# the database and Telegram payloads, and ``StrEnum`` would change ``str()``
# and JSON behaviour across the whole domain vocabulary.
"src/vpnbot/db/enums.py" = ["UP042"]
"src/vpnbot/services/fulfillment.py" = ["UP042"]
"src/vpnbot/services/import_service.py" = ["UP042"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
