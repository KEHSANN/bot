[project]
name = "vpnstore-backend"
version = "0.1.0"
description = "Persian-first Telegram VPN store"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0.41,<2.1",
  "asyncpg>=0.30,<1",
  "redis>=6.2,<8",
  "uvicorn>=0.34,<1",
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.16,<2",
  "pip-audit>=2.9,<3",
  "detect-secrets==1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = ["integration: requires real PostgreSQL and Redis"]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
